# ScheduleBoard API プロキシ設定
# 勤怠アプリ（kintai-backend）の /api/* とは完全に分離

# ScheduleBoard専用API: /api/scheduleboard/* を localhost:3000 にプロキシ
location /api/scheduleboard/ {
    proxy_pass http://localhost:3000/api/scheduleboard/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# 注意: 既存の location /api/ { ... } 設定（勤怠アプリ用）には触れないでください
# このlocation /api/scheduleboard/ ブロックを、既存のserver {}ブロック内に追加してください

