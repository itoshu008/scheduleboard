# === ScheduleBoard (/scheduleboard/) ===
# 静的ファイル配信用設定
location ^~ /scheduleboard/ {
    alias /var/www/html/scheduleboard/;              # ★末尾 / 必須（alias は特に重要）
    try_files $uri $uri/ /scheduleboard/index.html;  # ★SPA フォールバック
    
    # index.html は常に最新を取得（キャッシュ無効化）
    location ~* /scheduleboard/index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }
    
    # アセットファイル（JS/CSS）は長期キャッシュ（ファイル名にハッシュが含まれるため安全）
    location ~* /scheduleboard/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # その他の静的ファイル（画像など）
    location ~* /scheduleboard/.*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

