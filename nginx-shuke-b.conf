# shuke-b アプリケーション用 nginx設定
# 
# 使用方法:
# 1. 既存の nginx 設定ファイルに以下の内容をマージ
# 2. または、/etc/nginx/sites-available/shuke-b として保存し、
#    /etc/nginx/sites-enabled/ にシンボリックリンクを作成
#
# 重要: 既存アプリに影響を与えないよう、/shuke-b パスのみを追加

# shuke-b アプリケーション用のパス（静的ファイル配信）
location /shuke-b {
    alias /var/www/html/shuke-b;
    try_files $uri $uri/ /shuke-b/index.html;
    
    # CORS設定（必要に応じて調整）
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    # キャッシュ制御（JS/CSS/画像用）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # HTMLはキャッシュしない
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}

# API → バックエンドサーバー（すべてのアプリで共有）
# 既存の location /api/ があれば、そちらを優先してください
# なければ、以下を追加:
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS設定
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    # OPTIONSリクエスト対応
    if ($request_method = OPTIONS) {
        return 204;
    }
}

